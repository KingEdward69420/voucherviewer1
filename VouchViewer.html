<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VouchViewer</title>
  <style>:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b1016; color: #e7eef6; font: 14px/1.4 "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.45; }
header { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-bottom: 1px solid #2a3441; background: #0b1016; }
.top, .row, .level-row, .tools, .chips { display: flex; align-items: center; gap: 8px; }
.top { align-items: flex-start; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 8px; }
#brand { font-size: 16px; font-weight: 650; }
.ver, #venue, .muted, .fine, .kicker { color: #8b97a8; }
.ver { font-family: ui-monospace, monospace; font-size: 12px; }
#price { margin: 2px 0 0; font-family: ui-monospace, monospace; font-size: 30px; font-weight: 650; line-height: 1; }
#stats { margin: 4px 0 0; font-family: ui-monospace, monospace; font-size: 12px; color: #8b97a8; }
#stats.up { color: #16c784; }
#stats.down { color: #ea3943; }
#toggle-call { height: 42px; padding: 0 16px; border: 0; border-radius: 6px; background: #3d7eff; color: #f4f7ff; font-weight: 600; }
.tools { flex-wrap: wrap; }
#symbol, select, .chip, #load, #use-last, #use-open, #use-kalshi, #indicators, #quarters {
  height: 42px; border: 1px solid #2a3441; border-radius: 6px; background: #12181f; padding: 0 12px;
}
#symbol { width: 112px; text-transform: uppercase; }
.chip.on, #load { background: #3d7eff; border-color: #3d7eff; color: #f4f7ff; }
.chip { color: #8b97a8; }
.seg { display: flex; height: 42px; align-items: center; border: 1px solid #2a3441; border-radius: 6px; padding: 0 4px; }
.seg button { height: 34px; border: 0; border-radius: 4px; background: transparent; color: #8b97a8; padding: 0 12px; }
.seg button.on { background: #1a222c; color: #e7eef6; }
.update { height: 42px; display: flex; align-items: center; gap: 8px; border: 1px solid #2a3441; border-radius: 6px; background: #12181f; padding: 0 10px; color: #8b97a8; }
.update select { height: 32px; border: 0; background: transparent; padding: 0; }
.menu { position: relative; }
.menu-panel { display: none; position: absolute; right: 0; z-index: 5; width: 240px; max-height: 320px; overflow: auto; margin-top: 6px; padding: 10px; border: 1px solid #2a3441; border-radius: 6px; background: #12181f; }
.menu.open .menu-panel { display: block; }
.menu-panel p { margin: 8px 0 4px; color: #8b97a8; font-size: 12px; }
.menu-panel label { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
#status { display: none; margin: 0; color: #ea3943; }
#status:not(:empty) { display: block; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 394px; }
main.call-off { grid-template-columns: minmax(0, 1fr); }
main.call-off aside { display: none; }
#stage { position: relative; min-width: 0; min-height: 0; }
#chart { position: absolute; inset: 0; }
#quarters { position: absolute; z-index: 3; top: 8px; right: 8px; height: 28px; padding: 0 8px; font-size: 12px; }
aside { min-height: 0; overflow: auto; border-left: 1px solid #2a3441; background: #0b1016; padding: 16px; }
aside h2 { margin: 0; font-size: 14px; font-weight: 650; }
.level-row { margin-top: 8px; }
.level-row label { display: flex; flex: 1; flex-direction: column; gap: 4px; color: #8b97a8; font-size: 13px; }
#level { width: 100%; height: 42px; border: 1px solid #2a3441; border-radius: 6px; background: #0b1016; padding: 0 10px; font-family: ui-monospace, monospace; }
.live { margin-top: 14px; padding: 14px; border: 1px solid #2a3441; border-radius: 8px; background: #12181f; }
.live.up { background: rgba(22, 199, 132, 0.16); border-color: rgba(22, 199, 132, 0.45); }
.live.down { background: rgba(234, 57, 67, 0.16); border-color: rgba(234, 57, 67, 0.45); }
.live.warn { background: rgba(230, 179, 37, 0.16); border-color: rgba(230, 179, 37, 0.45); }
.live-top { display: flex; justify-content: space-between; gap: 12px; }
.call { margin: 4px 0 0; font-family: ui-monospace, monospace; font-size: 32px; font-weight: 700; }
.up { color: #16c784; }
.down { color: #ea3943; }
.warn { color: #e6b325; }
.clock-block { text-align: right; font-family: ui-monospace, monospace; font-size: 28px; font-weight: 700; }
.clock-block small { display: block; color: #8b97a8; font-size: 11px; letter-spacing: 0.08em; }
.gap { font-family: ui-monospace, monospace; font-size: 28px; font-weight: 650; }
.card { margin-top: 12px; padding: 12px; border: 1px solid #2a3441; border-radius: 8px; background: #12181f; }
.dead { opacity: 0.38; filter: grayscale(0.85); }
.dial svg { width: 120px; display: block; }
.dial-labels { display: flex; justify-content: space-between; color: #8b97a8; font-size: 11px; }
.fine { font-size: 12px; }
p { margin: 6px 0; }
html { -webkit-text-size-adjust: 100%; }
.card .row { justify-content: space-between; }
#srcs { margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: ui-monospace, monospace; font-size: 11px; color: #8b97a8; }
.src::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: #16c784; vertical-align: 1px; }
.src.off { opacity: 0.45; }
.src.off::before { background: #5d6b7c; }
.ans-settle { margin: 10px 0 0; font-size: 13px; }
.ans-rev { margin: 10px 0 0; font-size: 13px; }
.ans-rev b.warn { color: #e6b325; } .ans-rev b.ok { color: #16c784; }
.rev-sigs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.rs { padding: 2px 7px; border: 1px solid #2a3441; border-radius: 10px; font-size: 11px; color: #5d6b7c; }
.rs.on { border-color: rgba(230,179,37,0.6); background: rgba(230,179,37,0.12); color: #e6b325; }
.rs.live { border-style: dashed; }
.sb-main { display: flex; align-items: center; gap: 16px; }
.sb-main > div { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.sb-main b { font-size: 22px; font-weight: 800; }
.sb-main span { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #8b97a8; }
.sb-w b { color: #16c784; } .sb-l b { color: #ea3943; } .sb-rate b { color: #e7eef6; }
.sb-bar { display: block; width: 72px; height: 4px; margin-top: 4px; border-radius: 2px; background: rgba(234,57,67,0.55); overflow: hidden; }
.sb-bar i { display: block; height: 100%; width: 0; background: #16c784; transition: width 0.4s; }
.sb-mid { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 12px; }
.sb-mid b { font-size: 12px; }
.tick .sq { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; font-style: normal; font-size: 11px; font-weight: 800; color: #0b1016; }
.tick .sq.pass { color: #8b97a8; }
.tick .sq.pend { color: #e6b325; animation: pend 1.2s ease-in-out infinite; }
@keyframes pend { 50% { opacity: 0.35; } }
.livedot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #ea3943; vertical-align: 1px; animation: livep 1.6s infinite; }
@keyframes livep { 0% { box-shadow: 0 0 0 0 rgba(234,57,67,0.6); } 70% { box-shadow: 0 0 0 7px rgba(234,57,67,0); } 100% { box-shadow: 0 0 0 0 rgba(234,57,67,0); } }
#news-live { margin: 2px 0 0; }
.news-list li.pop { animation: npop 1.2s ease-out; }
@keyframes npop { 0% { opacity: 0; transform: translateY(-8px); background: rgba(61,126,255,0.25); } 25% { opacity: 1; transform: none; } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .livedot, .news-list li.pop, .tick .sq.pend { animation: none; } }
#price.fl-up { animation: flup 0.6s ease-out; }
#price.fl-dn { animation: fldn 0.6s ease-out; }
@keyframes flup { from { color: #16c784; } to { color: #e7eef6; } }
@keyframes fldn { from { color: #ea3943; } to { color: #e7eef6; } }
.tape, .tick, #news-card, .dl { contain: content; }
.tape { display: flex; align-items: center; gap: 8px; height: 30px; border: 1px solid #2a3441; border-radius: 6px; background: #12181f; overflow: hidden; font-size: 12px; }
.tape-lbl { flex: none; display: flex; align-items: center; height: 100%; padding: 0 8px; background: #3d7eff; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
.tape-win { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; -webkit-mask-image: linear-gradient(90deg, transparent, #000 20px, #000 calc(100% - 20px), transparent); mask-image: linear-gradient(90deg, transparent, #000 20px, #000 calc(100% - 20px), transparent); }
.tape-run { display: inline-flex; white-space: nowrap; animation: tape var(--d, 60s) linear infinite; will-change: transform; }
.tape-run:hover { animation-play-state: paused; }
.tape-run a { margin-right: 36px; color: #e7eef6; text-decoration: none; }
.tape-run a i { margin-right: 6px; color: #8b97a8; font-style: normal; }
@keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .tape-run { animation: none; } .tape-win { overflow-x: auto; } }
.news-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.news-tabs button { height: 28px; padding: 0 10px; border: 1px solid #2a3441; border-radius: 14px; background: transparent; color: #8b97a8; font-size: 12px; }
.news-tabs button.on { background: #3d7eff; border-color: #3d7eff; color: #fff; }
.news-srcs { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px; font-family: ui-monospace, monospace; font-size: 11px; color: #8b97a8; }
.news-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 440px; overflow: auto; }
.news-list li { padding: 8px 0; border-top: 1px solid #1c2633; }
.news-list a { display: block; color: #e7eef6; text-decoration: none; line-height: 1.35; overflow-wrap: anywhere; }
.news-list a:hover { text-decoration: underline; }
.news-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-size: 11px; color: #8b97a8; }
.nb { padding: 0 5px; border-radius: 3px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.nb.news { background: rgba(61,126,255,0.2); color: #7aa2ff; }
.nb.social { background: rgba(192,132,252,0.18); color: #c084fc; }
.nb.tech { background: rgba(230,179,37,0.18); color: #e6b325; }
.news-list li.fresh .news-meta::after { content: "NEW"; color: #16c784; font-weight: 700; }
.news-alert { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: #8b97a8; }
.snd { display: flex; align-items: center; gap: 6px; height: 42px; border: 1px solid #2a3441; border-radius: 6px; background: #12181f; padding: 0 6px; }
.snd button { height: 32px; border: 0; border-radius: 4px; background: transparent; color: #8b97a8; padding: 0 8px; white-space: nowrap; }
#snd-btn.on { background: #1a222c; color: #e7eef6; }
#snd-vol { width: 90px; accent-color: #3d7eff; }
.tick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 10px; border: 1px solid #2a3441; border-radius: 6px; background: #12181f; font-family: ui-monospace, monospace; font-size: 12px; color: #8b97a8; }
.tk-stats, .tk-up { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.tk-stats b { font-size: 14px; }
.tick .yes { color: #16c784; } .tick .no { color: #ea3943; } .tick .warn { color: #e6b325; }
.tk-sq { display: flex; gap: 3px; flex: 1; min-width: 120px; overflow-x: auto; }
.sq { flex: none; width: 12px; height: 12px; border-radius: 2px; background: #2a3441; }
.sq.hit { background: #16c784; } .sq.loss { background: #ea3943; } .sq.pass { background: #3a4553; }
.sq.pend { background: transparent; box-shadow: inset 0 0 0 1.5px #e6b325; }
#tk-reset { height: 24px; padding: 0 8px; border: 1px solid #2a3441; border-radius: 4px; background: transparent; color: #8b97a8; font-size: 11px; }
.ans-srcs { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 12px; font-size: 12px; color: #8b97a8; }
.sx i { font-style: normal; font-family: ui-monospace, monospace; font-weight: 700; }
.sx i.yes { color: #16c784; } .sx i.no { color: #ea3943; }
.sx.off { opacity: 0.5; } .sx.off i { font-weight: 400; }
.dial-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dial-pair[hidden] { display: none; }
.dl { margin-top: 12px; }
.dl .row h2 { font-size: 13px; }
.dl .row span { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; }
.dl-svg { width: 100%; max-width: 170px; display: block; margin: 6px auto 0; }
.ndl { transform-origin: 60px 62px; transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
.dl-t { margin: 6px 0 0; font-size: 12px; color: #8b97a8; }
@media (prefers-reduced-motion: reduce) { .ndl { transition: none; } }
.level-row { flex-wrap: wrap; }
.level-row label { flex-basis: 100%; }
.level-row button { flex: 1; }
#prob { position: relative; height: 170px; margin-top: 8px; }
#prob-now { font-family: ui-monospace, monospace; font-weight: 650; }
.ans { margin-top: 12px; padding: 16px; border: 1px solid #2a3441; border-radius: 8px; background: #12181f; }
.ans-yes { border-color: rgba(22,199,132,0.5); background: rgba(22,199,132,0.08); }
.ans-no { border-color: rgba(234,57,67,0.5); background: rgba(234,57,67,0.08); }
.ans-close { border-color: rgba(230,179,37,0.5); background: rgba(230,179,37,0.06); }
.ans-q { margin: 0; color: #8b97a8; font-size: 13px; }
.ans-a { margin: 2px 0 0; font-family: ui-monospace, monospace; font-size: 56px; font-weight: 800; line-height: 1.05; }
.ans-yes .ans-a, b.yes { color: #16c784; }
.ans-no .ans-a, b.no { color: #ea3943; }
.ans-close .ans-a { color: #e6b325; font-size: 40px; }
.ans-m { margin: 4px 0 0; font-size: 15px; }
.ans-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.ans-split div { padding: 10px; border-radius: 6px; text-align: center; }
.ans-split b { display: block; font-family: ui-monospace, monospace; font-size: 28px; }
.ans-split span { font-size: 12px; }
.ans-up { background: rgba(22,199,132,0.16); color: #16c784; }
.ans-dn { background: rgba(234,57,67,0.16); color: #ea3943; }
.ans-split .dim { opacity: 0.4; }
.ans-lock { margin: 12px 0 0; font-size: 13px; color: #8b97a8; }
#flip-target { height: 28px; padding: 0 6px; font-size: 12px; border-radius: 4px; }
.flip-lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8b97a8; }
.fb { margin-top: 10px; padding: 12px; border: 1px solid #2a3441; border-radius: 6px; }
.fb.yes { border-color: rgba(22,199,132,0.55); background: rgba(22,199,132,0.1); }
.fb.no { border-color: rgba(234,57,67,0.55); background: rgba(234,57,67,0.1); }
.fb.close { border-color: rgba(230,179,37,0.45); background: rgba(230,179,37,0.06); }
.fb-big { display: block; font-family: ui-monospace, monospace; font-size: 30px; font-weight: 800; line-height: 1.1; }
.fb.yes .fb-big { color: #16c784; } .fb.no .fb-big { color: #ea3943; } .fb.close .fb-big { color: #e6b325; }
.fb-sub { margin: 4px 0 0; font-size: 13px; color: #c9d3df; }
.fm-top { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-size: 13px; }
.fm-top b { font-family: ui-monospace, monospace; font-size: 22px; }
.fm-bar { position: relative; height: 8px; margin-top: 4px; border-radius: 4px; background: #1c2633; overflow: hidden; }
.fm-bar i { display: block; height: 100%; border-radius: 4px; transition: width 0.4s; }
.fm-bar u { position: absolute; top: 0; bottom: 0; width: 2px; background: #e7eef6; opacity: 0.6; }
@media (prefers-reduced-motion: reduce) { .fm-bar i { transition: none; } }
.hm-wrap { overflow-x: auto; margin-top: 8px; }
.hm { width: 100%; border-collapse: collapse; table-layout: fixed; font-family: ui-monospace, monospace; font-size: 10px; }
.hm th { padding: 2px 0; color: #8b97a8; font-weight: 400; white-space: nowrap; }
.hm th:first-child { width: 52px; text-align: left; }
.hm td { padding: 5px 0; text-align: center; color: #e7eef6; border: 1px solid #12181f; }
.hm td.thin { color: #5d6b7c; }
.hm td.cur { outline: 2px solid #e7eef6; outline-offset: -2px; font-weight: 700; }
.fls { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.fl { padding: 2px 7px; border: 1px solid #2a3441; border-radius: 10px; font-family: ui-monospace, monospace; font-size: 11px; color: #8b97a8; }
.fl b { color: #e7eef6; font-weight: 600; }
.fl.on { border-color: #3d7eff; background: rgba(61,126,255,0.16); }
.flip-h { margin: 14px 0 0; font-size: 12px; font-weight: 650; color: #c9d3df; }
.sug { margin-top: 12px; padding: 10px 12px; border: 1px solid rgba(61,126,255,0.55); border-radius: 6px; background: rgba(61,126,255,0.1); }
.sug.now { border-color: rgba(22,199,132,0.6); background: rgba(22,199,132,0.12); }
.sug-t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sug-t b { font-family: ui-monospace, monospace; font-size: 20px; }
.sug p { margin: 4px 0 0; font-size: 12px; color: #c9d3df; }
.scv { display: flex; gap: 3px; margin-top: 8px; overflow-x: auto; }
.scv span { flex: 1 0 22px; padding: 3px 0; border-radius: 3px; text-align: center; font-family: ui-monospace, monospace; font-size: 10px; color: #e7eef6; }
.scv span.pick { outline: 2px solid #e7eef6; outline-offset: -2px; font-weight: 700; }
.scv span.past { opacity: 0.3; }
.scl { display: flex; justify-content: space-between; font-size: 10px; color: #8b97a8; margin-top: 2px; }
.fmx { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.mx { padding: 6px 8px; border: 1px solid #2a3441; border-radius: 6px; font-size: 11px; color: #8b97a8; }
.mx b { display: block; font-family: ui-monospace, monospace; font-size: 14px; color: #e7eef6; }
.mx.ok { border-color: rgba(22,199,132,0.4); } .mx.ok b { color: #16c784; }
.mx.warn { border-color: rgba(230,179,37,0.45); } .mx.warn b { color: #e6b325; }
.mx.bad { border-color: rgba(234,57,67,0.5); } .mx.bad b { color: #ea3943; }
@media (max-width: 980px) {
  body { height: auto; overflow: auto; }
  main, main.call-off { grid-template-columns: 1fr; }
  #stage { height: 70dvh; }
  aside { border-left: 0; border-top: 1px solid #2a3441; }
  main.call-off aside { display: none; }
}
@media (max-width: 700px) {
  header { padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; gap: 8px; }
  .tools.scroll { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; }
  .tools.scroll::-webkit-scrollbar { display: none; }
  .tools.scroll > *, .tools.scroll .chips > * { flex: none; }
  #price { font-size: 26px; }
  #toggle-call { height: 38px; padding: 0 12px; white-space: nowrap; flex: none; }
  #symbol, #level, select { font-size: 16px; }
  #stage { height: 58svh; min-height: 300px; }
  aside { padding: 14px 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .level-row { flex-wrap: wrap; }
  .level-row label { flex-basis: 100%; }
  .level-row button { flex: 1; }
  .menu-panel { width: min(240px, calc(100vw - 24px)); }
  .call, .clock-block, .gap { font-size: 24px; }
}
</style>
</head>
<body>
  <header>
    <div class="top">
      <div>
        <div class="brand">
          <strong id="brand">VouchViewer</strong>
          <span id="ver" class="ver"></span>
          <span id="venue">Coinbase</span>
        </div>
        <div id="price">—</div>
        <p id="stats"></p>
        <p id="srcs"></p>
      </div>
      <button id="toggle-call" type="button">Hide call</button>
    </div>
    <div class="tools scroll">
      <input id="symbol" aria-label="Coin" spellcheck="false" />
      <span id="coins" class="chips"></span>
      <select id="exchange" aria-label="Exchange"></select>
      <button id="load" type="button">Load</button>
    </div>
    <div class="tools">
      <span id="quotes" class="chips"></span>
      <span id="intervals" class="chips"></span>
      <label class="update">Update <select id="refresh" aria-label="Refresh"></select></label>
